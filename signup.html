<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up - Curio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#0b0f0c,#10241a,#1b4332,#081c15);
    color:white;
}

.signup-box{
    width:360px;
    padding:30px;
    border-radius:20px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:#00ffcc;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
}

input{
    width:100%;
    padding:13px;
    margin-bottom:16px;
    border:none;
    outline:none;
    border-radius:10px;
    background:rgba(0,0,0,0.35);
    color:white;
    border:1px solid rgba(255,255,255,0.1);
}

input:focus{
    border-color:#00ffcc;
}

.password-box{
    position:relative;
    margin-bottom:16px;
}

.password-box input{
    margin-bottom:0;
    padding-right:45px;
}

.show-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:18px;
    color:#aaa;
    user-select:none;
}

.show-password:hover{
    color:#00ffcc;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#00c896,#00ffcc);
    color:#06110e;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:translateY(-1px);
}

button:disabled{
    opacity:0.7;
    cursor:not-allowed;
}

.login{
    text-align:center;
    margin-top:18px;
    font-size:13px;
    color:#aaa;
}

.login a{
    color:#00ffcc;
    text-decoration:none;
}

.login a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="signup-box">

    <div class="logo">
        Curio ⚡
    </div>

    <div class="subtitle">
        Create your account
    </div>

    <label>
        Name
    </label>

    <input
        id="name"
        type="text"
        placeholder="Enter your name"
        autocomplete="name"
    >

    <label>
        Email
    </label>

    <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
    >

    <label>
        Password
    </label>

    <div class="password-box">

        <input
            id="password"
            type="password"
            placeholder="Create a password"
            autocomplete="new-password"
        >

        <span
            id="showPassword"
            class="show-password"
            title="Show password"
        >👁️</span>

    </div>

    <label>
        Confirm Password
    </label>

    <div class="password-box">

        <input
            id="confirmPassword"
            type="password"
            placeholder="Confirm your password"
            autocomplete="new-password"
        >

        <span
            id="showConfirmPassword"
            class="show-password"
            title="Show password"
        >👁️</span>

    </div>

    <button
        id="signupButton"
        type="button"
    >
        Sign Up
    </button>

    <div class="login">
        Already have an account?
        <a href="/login.html">
            Login
        </a>
    </div>

</div>


<script>

const nameInput =
    document.getElementById("name");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirmPassword");

const signupButton =
    document.getElementById("signupButton");

const showPassword =
    document.getElementById("showPassword");

const showConfirmPassword =
    document.getElementById("showConfirmPassword");


/* Password Show / Hide */

showPassword.addEventListener(
    "click",
    () => {

        if (
            passwordInput.type === "password"
        ) {

            passwordInput.type = "text";

            showPassword.textContent = "🙈";

            showPassword.title =
                "Hide password";

        } else {

            passwordInput.type = "password";

            showPassword.textContent = "👁️";

            showPassword.title =
                "Show password";
        }

    }
);


/* Confirm Password Show / Hide */

showConfirmPassword.addEventListener(
    "click",
    () => {

        if (
            confirmPasswordInput.type === "password"
        ) {

            confirmPasswordInput.type = "text";

            showConfirmPassword.textContent =
                "🙈";

            showConfirmPassword.title =
                "Hide password";

        } else {

            confirmPasswordInput.type =
                "password";

            showConfirmPassword.textContent =
                "👁️";

            showConfirmPassword.title =
                "Show password";
        }

    }
);


/* Signup */

signupButton.addEventListener(
    "click",
    async () => {

        const name =
            nameInput.value.trim();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        /* Empty field check */

        if (
            !name ||
            !email ||
            !password ||
            !confirmPassword
        ) {

            alert(
                "Please fill all fields."
            );

            return;
        }


        /* Password match check */

        if (
            password !== confirmPassword
        ) {

            alert(
                "Passwords do not match."
            );

            return;
        }


        signupButton.disabled = true;

        signupButton.textContent =
            "Creating account...";


        try {

            const response =
                await fetch(
                    "/signup",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                name:
                                    name,

                                email:
                                    email,

                                password:
                                    password
                            })
                    }
                );


            const data =
                await response.json();


            if (data.success) {

                alert(
                    "Account created successfully! 🎉"
                );

                window.location.href =
                    "/login.html";

            } else {

                alert(
                    data.message ||
                    "Signup failed."
                );
            }


        } catch (error) {

            console.error(
                "Signup Error:",
                error
            );

            alert(
                "Unable to connect to Curio server."
            );

        } finally {

            signupButton.disabled =
                false;

            signupButton.textContent =
                "Sign Up";
        }

    }
);

</script>

</body>
</html>
